name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev]"
      - run: ruff check src tests eval scripts
      - run: python scripts/gen_docs.py && git diff --exit-code docs/commands.md
      - run: pyright

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - run: uv pip install -e ".[dev]"
      - name: Tests
        env:
          # Hosted runners are slower than a warm laptop; the 300 ms budget is checked on Linux.
          VIDEOCLI_STARTUP_BUDGET_MS: ${{ matrix.os == 'ubuntu-latest' && '300' || '1500' }}
        run: pytest -q

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release
      - name: install.sh (unattended, from this checkout)
        if: runner.os != 'Windows'
        env:
          VIDEOCLI_INSTALL_SOURCE: ${{ github.workspace }}
        run: |
          sh install.sh </dev/null
          sh install.sh </dev/null   # re-run upgrades in place
          ~/.local/bin/videocli doctor --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['ok']; print(d['data']['ffmpeg'])"
      - name: install.ps1 (unattended, from this checkout)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VIDEOCLI_INSTALL_SOURCE: ${{ github.workspace }}
        run: |
          ./install.ps1 -Profile lecture
          videocli doctor --json
